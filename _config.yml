title: Roza-Room
description: Documentation et journal de bord de mes projets personnels
theme: bulma-clean-theme
lang: fr

# Adresse du site en ligne ; baseurl (/Roza-Room) est fourni par le workflow de déploiement
url: "https://r0zalynd.github.io"
baseurl: ""

permalink: pretty
fixed_navbar: top
theme_color: "#0A2A2A"
force_theme: light
favicon: /assets/img/favicon.png
footer_menu: footer_navigation
hide_share_buttons: true

# Journal de bord
excerpt_separator: "<!--more-->"

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

collections:
  projects:
    output: true
    permalink: /projects/:path/
  docs:
    output: true
    permalink: /docs/:path/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: documentation
      hero_height: is-small
      menubar_toc: true
      toc_title: Sommaire
  # Page d'accueil d'un projet : _projects/<slug>/index.md
  - scope:
      path: "_projects/*/index.md"
    values:
      layout: project
      menubar_toc: false
  - scope:
      path: ""
      type: docs
    values:
      layout: documentation
      hero_height: is-small
      menubar_toc: true
      toc_title: Sommaire
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      hero_height: is-small
      permalink: /journal/:year/:month/:day/:title/
  # Esquisses : articles de esquisses/_posts/ (catégorie « esquisses »), aussi listés dans le journal
  - scope:
      path: "esquisses"
      type: posts
    values:
      layout: esquisse
      hero_height: is-small
      menubar_toc: true
      toc_title: Sommaire
      permalink: /esquisses/:title/

sass:
  silence_deprecations:
    - import
    - if-function
    - global-builtin

exclude:
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - Makefile
  - vendor/
