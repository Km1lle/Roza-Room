<nav
    class="navbar is-dark {% if site.fixed_navbar %} is-fixed-{{ site.fixed_navbar }} {% endif %}"
    x-data="{ openNav: false }"
>
    <div class="container">
        <div class="navbar-brand">
            <a href="{{ '/' | relative_url }}" class="navbar-item has-text-weight-bold">
                {{ site.title }}
            </a>
            <a
                role="button"
                class="navbar-burger burger"
                aria-label="menu"
                aria-expanded="false"
                data-target="navMenu"
                :class="{ 'is-active': openNav }"
                x-on:click="openNav = !openNav"
            >
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
            </a>
        </div>
        <div class="navbar-menu" id="navMenu" :class="{ 'is-active': openNav }">
            <div class="navbar-end">
                {% for item in site.data.navigation %}
                    <a
                        href="{{ item.link | relative_url }}"
                        class="navbar-item {% if page.url contains item.link %}is-active{% endif %}"
                    >
                        {{- item.name -}}
                    </a>
                {% endfor %}
            </div>
        </div>
    </div>
</nav>
