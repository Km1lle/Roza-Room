{%- comment -%}
  Diagrammes Mermaid : un bloc de code ```mermaid est rendu en schéma.
  Le script n'est chargé que si la page en contient un.
{%- endcomment -%}
{%- if content contains 'language-mermaid' -%}
<script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
    document.querySelectorAll("pre > code.language-mermaid").forEach((code) => {
        const div = document.createElement("div");
        div.className = "mermaid";
        div.textContent = code.textContent;
        const block = code.closest(".highlighter-rouge") || code.parentElement;
        block.replaceWith(div);
    });
    // Couleurs alignées sur la palette de assets/css/app.scss
    mermaid.initialize({
        startOnLoad: false,
        theme: "base",
        themeVariables: {
            primaryColor: "#FFEBD1",
            primaryBorderColor: "#15676D",
            primaryTextColor: "#001724",
            lineColor: "#15676D",
            secondaryColor: "#15676D",
            tertiaryColor: "#FFFFFF",
        },
    });
    await mermaid.run();
</script>
{%- endif -%}
